apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    # Pin an explicit chart version rather than tracking latest, so upgrades
    # are a deliberate git commit. Check for newer releases with:
    #   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
    #   helm search repo prometheus-community/kube-prometheus-stack --versions
    targetRevision: 65.5.1
    helm:
      # This chart's CRDs (prometheuses, alertmanagers, etc.) are large enough
      # to hit Kubernetes' 256KiB metadata.annotations limit. Neither a plain
      # sync nor `syncOptions: [ServerSideApply=true]` at the Application
      # level reliably avoids this for CRDs shipped in Helm's special crds/
      # folder (confirmed empirically - both still failed with the same
      # "Too long" error). Skip CRD management here entirely and install
      # them once, out of band, matching this exact targetRevision:
      #   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      #   helm show crds prometheus-community/kube-prometheus-stack --version 65.5.1 \
      #     | kubectl apply --server-side -f -
      skipCrds: true
      values: |
        # K3s bundles the controller-manager, scheduler, and kube-proxy into
        # its single k3s binary rather than running them as separately
        # scrapeable components the way kubeadm clusters do - this chart's
        # default ServiceMonitors for them can never find a real target, so
        # KubeControllerManagerDown/KubeSchedulerDown/KubeProxyDown are
        # permanent false positives on K3s, not real signal. Discovered
        # 2026-08-29 once Alertmanager's null-receiver bug (see the
        # alertmanager.config comment below) was fixed and these actually
        # started reaching ntfy for the first time. Disabling the component
        # here removes both the doomed ServiceMonitor and its alert rule.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false

        prometheus:
          prometheusSpec:
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi

        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 5Gi

          # Closes the "alerts fire into the void" gap: this chart's default
          # config has no receiver wired up at all. `ntfy-alertmanager`
          # (kubernetes/apps/ntfy-alertmanager.yaml) is a small bridge in the
          # same `monitoring` namespace - Alertmanager's webhook_configs has
          # no templating support of its own, so it can't reshape its fixed
          # JSON payload into ntfy's title/priority/tags fields directly;
          # the bridge does that translation. See docs/01-setup-and-runbook.md
          # for the exact ntfy.sh topic to subscribe to.
          # CONFIRMED BUG (2026-08-29, docs/01-setup-and-runbook.md bug 34):
          # this config silently failed validation for its entire life until
          # this fix - the chart auto-injects a `route.routes[]` sub-route
          # sending the Watchdog alert to a receiver literally named "null"
          # (its own convention for "drop this"), regardless of what
          # `receivers:` you provide. Supplying a `receivers:` list that
          # doesn't include a receiver named "null" makes the Prometheus
          # Operator reject the whole config at its own validation step
          # ("undefined receiver \"null\" used in route") and silently keep
          # the last-good (i.e. default, nothing-configured) generated
          # config instead - Helm/kubectl/ArgoCD all reported success
          # throughout, because the Secret Helm renders is valid YAML; only
          # the Operator's *semantic* validation of it, one layer further
          # in, ever saw the problem, and it fails closed silently rather
          # than surfacing anywhere ArgoCD or `kubectl get` would show it.
          # Only `kubectl get secret alertmanager-kube-prometheus-stack-
          # alertmanager-generated` (not the similarly-named secret without
          # -generated, which is just Helm's input and was never the issue)
          # and the operator's own pod logs ever showed the real, currently-
          # active config - verify against that secret specifically after
          # touching this block.
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ['alertname', 'severity']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              receiver: 'ntfy'
            receivers:
              - name: 'ntfy'
                webhook_configs:
                  - url: 'http://ntfy-alertmanager.monitoring.svc.cluster.local:8080/'
                    send_resolved: true
              - name: 'null'

        grafana:
          persistence:
            enabled: true
            storageClassName: longhorn
            accessModes:
              - ReadWriteOnce
            size: 10Gi
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - grafana.matt-host.de
            path: /
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.matt-host.de

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # This chart's CRDs (prometheuses, alertmanagers, etc.) have large
      # enough OpenAPI schemas to exceed Kubernetes' 256KiB annotation limit
      # under ArgoCD's default client-side-apply-style sync, the same issue
      # hit bootstrapping ArgoCD itself (see kubernetes/bootstrap/install-argocd.sh).
      # Server-side apply avoids writing that annotation at all.
      - ServerSideApply=true
