# Bitnami Sealed Secrets controller. Deployed into kube-system with the
# chart's default release/controller name (sealed-secrets) so `kubeseal`'s
# own defaults (--controller-namespace kube-system,
# --controller-name sealed-secrets) work with zero extra flags anywhere this
# is used from.
#
# Chart repo moved recently: the old bitnami-labs.github.io/sealed-secrets
# index now 404s - the maintained repo is bitnami.github.io/sealed-secrets
# (org moved from bitnami-labs to bitnami on GitHub too). Verify before
# bumping targetRevision:
#   helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
#   helm search repo sealed-secrets/sealed-secrets --versions
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.19.3
    helm:
      releaseName: sealed-secrets
      values: |
        fullnameOverride: sealed-secrets-controller

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
