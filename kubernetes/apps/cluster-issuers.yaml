# Plain Kubernetes manifest, not an ArgoCD Application - the ClusterIssuer
# CRD only exists once the cert-manager Application above has synced, so
# this must be applied AFTER cert-manager is running:
#   kubectl apply -f kubernetes/apps/cluster-issuers.yaml
#
# (Same first-run pattern as kubernetes/apps/kube-prometheus-stack.yaml -
# see the root README's Phase 6 "App-of-Apps" item for why this manual step
# still exists.)
#
# Requires port 80 (HTTP-01 challenge) and 443 forwarded from your router to
# a K3s node - Traefik listens on both via K3s's built-in LoadBalancer/
# klipper-lb on every node's host IP.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "matti.wei@web.de"
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
