apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # 2026-10-10: the classic repo (https://immich-app.github.io/immich-
    # charts) stopped being published to after 0.12.1 - confirmed via its
    # index.yaml, which tops out there. 0.13.x+ only exists as an OCI
    # artifact at ghcr.io/immich-app/immich-charts (confirmed via the GHCR
    # anonymous-pull tags/list API). No oci:// scheme prefix on repoURL -
    # ArgoCD (v3.5.2 here) infers OCI from the bare registry host + a
    # `chart` field, same as the old classic-repo form otherwise.
    repoURL: ghcr.io/immich-app/immich-charts
    chart: immich
    targetRevision: 0.13.4
    helm:
      values: |
        # NOTE: Immich removed Typesense in favor of native Postgres
        # (pgvector) search around v1.90 - current chart versions don't
        # have a Typesense component, so it's intentionally absent below.
        #
        # NOTE: `immich-postgres-secret` (keys: password, DB_PASSWORD) is
        # intentional - no DB password is committed to git. Create it once,
        # manually, before the first sync:
        #   kubectl create namespace immich
        #   kubectl create secret generic immich-postgres-secret -n immich \
        #     --from-literal=password=<random> \
        #     --from-literal=DB_PASSWORD=<same random value>
        # (This is exactly the gap Phase 6 of the root README flags under
        # "GitOps Secrets Management" - a real Sealed Secrets / External
        # Secrets setup would remove this manual step.)
        #
        # 2026-10-10: chart jumped 0.9.1 -> 0.13.4 (Immich v1.119.0 ->
        # v3.2.0). Somewhere in that range immich-charts rebuilt itself on
        # bjw-s's "common" library chart (controllers/containers/service,
        # the same pattern countless other charts use) - EVERY value path
        # below changed shape as a result; none of the old flat keys exist
        # any more (confirmed against
        # github.com/immich-app/immich-charts/blob/immich-0.13.4/charts/
        # immich/values.yaml directly, not from memory/training data, since
        # this chart has clearly been restructured since). If bumping this
        # chart again, re-diff values.yaml at the new tag before touching
        # anything below - don't assume the shape holds.
        #
        # Postgres: the chart's bundled `postgresql` subchart hard-fails to
        # render (not just deprecated). Redis: the chart now bundles its
        # own `valkey` (Redis-compatible) dependency, disabled below in
        # favor of the standalone deployment we already run - see
        # kubernetes/apps/immich-postgres.yaml (covers both despite the
        # name) - the shared env block points at both standalone services.
        #
        # This top-level `controllers.main.containers.main.env` is the
        # *shared* block the chart's own values.yaml comments say applies
        # to every enabled component (server, machine-learning) - this is
        # where DB_PASSWORD has to go now, not under `server:`.
        #
        # IMPORTANT for any future jump from something around v1.1xx:
        # going straight to v3.2.0 fails migrations with "Invalid upgrade
        # path" (docs.immich.app/errors/#typeorm-upgrade) - Immich requires
        # landing on a version in the 1.132.0-1.136.0 range first. No
        # published immich-charts release lands there (0.9.x -> v1.119.0,
        # 0.10.0 jumps straight to v2.0.0), so that has to be done with a
        # one-off `controllers.main.containers.main.image.tag: v1.132.3`
        # override here, synced once, confirmed via `Migration ... succeeded`
        # in the server logs and /api/server/version, THEN removed again -
        # this is already a fresh install's new baseline, not a step to
        # repeat on every future bump past this point.
        controllers:
          main:
            containers:
              main:
                env:
                  DB_HOSTNAME: immich-postgres
                  DB_USERNAME: immich
                  DB_DATABASE_NAME: immich
                  DB_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: immich-postgres-secret
                        key: password
                  REDIS_HOSTNAME: immich-redis

        valkey:
          enabled: false

        server:
          ingress:
            main:
              enabled: true
              className: traefik
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt-prod
              hosts:
                - host: cloud.matt-host.de
                  paths:
                    - path: /
                      pathType: Prefix
                      service:
                        identifier: main
              tls:
                - secretName: immich-tls
                  hosts:
                    - cloud.matt-host.de

        # The chart does NOT auto-create the library volume - "existingClaim"
        # is the only supported option. Create the PVC once, out of band,
        # before first sync:
        #   kubectl create namespace immich
        #   kubectl apply -f - <<'EOF'
        #   apiVersion: v1
        #   kind: PersistentVolumeClaim
        #   metadata:
        #     name: immich-library
        #     namespace: immich
        #   spec:
        #     accessModes: ["ReadWriteOnce"]
        #     storageClassName: longhorn
        #     resources:
        #       requests:
        #         storage: 200Gi
        #   EOF
        immich:
          persistence:
            library:
              existingClaim: immich-library

        # type: pvc -> type: persistentVolumeClaim, and accessModes (list)
        # -> accessMode (singular) - both renamed by the common-library
        # rewrite, not just a cosmetic diff from the old chart.
        machine-learning:
          persistence:
            cache:
              enabled: true
              type: persistentVolumeClaim
              accessMode: ReadWriteOnce
              storageClass: longhorn
              size: 20Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: immich

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
