apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://immich-app.github.io/immich-charts
    chart: immich
    # Immich's chart moves fast and has occasionally changed distribution
    # method (classic Helm repo vs OCI at ghcr.io/immich-app/immich-charts).
    # Verify before first apply:
    #   helm repo add immich https://immich-app.github.io/immich-charts
    #   helm search repo immich/immich --versions
    targetRevision: 0.9.1
    helm:
      values: |
        # NOTE: Immich removed Typesense in favor of native Postgres
        # (pgvector) search around v1.90 - current chart versions don't
        # have a Typesense component, so it's intentionally absent below.
        # If you're targeting an older Immich release that still needs
        # Typesense, this manifest doesn't cover that.
        #
        # NOTE: `immich-postgres-secret` (keys: password, DB_PASSWORD) is
        # intentional - no DB password is committed to git. Create it once,
        # manually, before the first sync:
        #   kubectl create namespace immich
        #   kubectl create secret generic immich-postgres-secret -n immich \
        #     --from-literal=password=<random> \
        #     --from-literal=DB_PASSWORD=<same random value>
        # (This is exactly the gap Phase 6 of the root README flags under
        # "GitOps Secrets Management" - a real Sealed Secrets / External
        # Secrets setup would remove this manual step.)
        #
        # All value paths below reflect the immich-charts umbrella chart's
        # structure as of this writing - run `helm show values immich/immich
        # --version <targetRevision>` before first apply and adjust key
        # names if they've drifted.

        # Postgres: the chart's bundled `postgresql` subchart hard-fails to
        # render (not just deprecated). Redis: the bundled `redis` subchart
        # pulls a Bitnami image tag Docker Hub no longer serves (Bitnami
        # pulled many free tags in 2025 moving to a paid model). Both
        # replaced with standalone deployments - see
        # kubernetes/apps/immich-postgres.yaml (covers both despite the
        # name) - and the shared env block below points at them instead.
        #
        # DB_PASSWORD must be set HERE, not via server.envFrom: the chart's
        # own default values.yaml already defines `env.DB_PASSWORD` (as a
        # template pulling the now-unused postgresql.global.postgresql.auth
        # .password, which itself defaults to the literal string "immich").
        # A plain container env entry always wins over envFrom for the same
        # key, so envFrom here silently lost to that baked-in placeholder -
        # confirmed the hard way via `kubectl get pod -o jsonpath` showing
        # DB_PASSWORD: "immich" in the rendered pod despite envFrom being
        # set. Overriding the same `env.DB_PASSWORD` values path replaces
        # the chart's default outright instead of losing a merge fight.
        env:
          DB_HOSTNAME: immich-postgres
          DB_USERNAME: immich
          DB_DATABASE_NAME: immich
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-postgres-secret
                key: password
          REDIS_HOSTNAME: immich-redis

        server:
          ingress:
            main:
              enabled: true
              ingressClassName: traefik
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt-prod
              hosts:
                - host: cloud.matt-host.de
                  paths:
                    - path: /
                      pathType: Prefix
              tls:
                - secretName: immich-tls
                  hosts:
                    - cloud.matt-host.de

        # The chart does NOT auto-create the library volume - "existingClaim"
        # is the only supported option (confirmed via `helm show values`).
        # Create the PVC once, out of band, before first sync:
        #   kubectl create namespace immich
        #   kubectl apply -f - <<'EOF'
        #   apiVersion: v1
        #   kind: PersistentVolumeClaim
        #   metadata:
        #     name: immich-library
        #     namespace: immich
        #   spec:
        #     accessModes: ["ReadWriteOnce"]
        #     storageClassName: longhorn
        #     resources:
        #       requests:
        #         storage: 200Gi
        #   EOF
        immich:
          persistence:
            library:
              existingClaim: immich-library

        machine-learning:
          persistence:
            cache:
              enabled: true
              type: pvc
              storageClass: longhorn
              size: 20Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: immich

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
