apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tandoor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Raw Kubernetes manifests (not a Helm chart) - see
  # kubernetes/apps/manifests/tandoor/tandoor.yaml. Chosen deliberately over
  # a community Helm chart: full control/certainty over every field instead
  # of betting on a fast-moving third-party chart's value schema.
  source:
    repoURL: https://github.com/MatthiasWeier/remote-devops-lab.git
    targetRevision: main
    path: kubernetes/apps/manifests/tandoor

  destination:
    server: https://kubernetes.default.svc
    namespace: tandoor

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
