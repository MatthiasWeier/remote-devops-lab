# Kubernetes-native policy engine. Deployed first, separately from the
# actual policies (kyverno-policies.yaml) - same split-Application pattern
# already used for metallb/metallb-config in this repo, because the
# ClusterPolicy CRD doesn't exist until this chart has synced.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    # Pin explicit version rather than tracking latest, same reasoning as
    # every other chart in this repo. Check for newer releases with:
    #   helm repo add kyverno https://kyverno.github.io/kyverno/
    #   helm search repo kyverno/kyverno --versions
    targetRevision: 3.9.0

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kyverno's CRDs (ClusterPolicy etc.) are large - `helm show crds`
      # returns nothing for this chart (same as metallb - CRDs aren't
      # shipped via Helm's special crds/ folder), so the usual `skipCrds`
      # workaround is a no-op here. Server-side apply avoids the 256KiB
      # last-applied-configuration annotation limit proactively, same
      # defensive reasoning as kube-prometheus-stack/metallb in this repo.
      - ServerSideApply=true
