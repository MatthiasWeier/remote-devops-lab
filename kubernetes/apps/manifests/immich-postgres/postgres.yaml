# Standalone Postgres for Immich, deployed outside the immich Helm chart.
#
# The immich-charts chart's bundled `postgresql` subchart is hard-deprecated:
# setting `postgresql.enabled: true` makes the chart's own checks.yaml
# template fail to render at all (not just a warning). See
# https://github.com/immich-app/immich-charts/issues/149. Immich requires
# a vector-search Postgres extension, which plain postgres images don't have.
#
# 2026-10-10: moved off tensorchord/pgvecto-rs (now deprecated upstream) to
# ghcr.io/immich-app/postgres, Immich's own image, which bundles BOTH the
# old pgvecto-rs/`vectors` extension AND its replacement, VectorChord/
# `vchord` - that overlap is deliberate, it's the official migration path
# (https://docs.immich.app/administration/postgres-standalone): Immich
# itself reindexes clip_index/face_index onto vchord the first time a
# vchord-aware server version starts against this image, then `vectors` can
# be dropped. Keep both CREATE EXTENSION lines below until that migration
# has run and been confirmed (check for "Reindexed clip_index"/"Reindexed
# face_index" in the immich-server logs) - only then is it safe to drop
# `vectors` and move to the leaner postgres image tag without pgvecto-rs.
#
# NOTE: init.sql only runs on a brand-new empty PGDATA (docker-entrypoint-
# initdb.d semantics) - it does NOT re-run on an existing volume. On an
# in-place upgrade of an already-initialized instance, `CREATE EXTENSION
# IF NOT EXISTS vchord CASCADE;` has to be run by hand once via psql.
#
# Expects `immich-postgres-secret` to already exist in the immich namespace
# with a `password` key (created manually, see immich.yaml's comments).

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-postgres-init
  namespace: immich
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS cube;
    CREATE EXTENSION IF NOT EXISTS earthdistance;
    CREATE EXTENSION IF NOT EXISTS vectors;
    CREATE EXTENSION IF NOT EXISTS vchord CASCADE;

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-data
  namespace: immich
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres
  namespace: immich
spec:
  serviceName: immich-postgres
  replicas: 1
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          env:
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-secret
                  key: password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-postgres-data
        - name: init
          configMap:
            name: immich-postgres-init
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
spec:
  selector:
    app: immich-postgres
  ports:
    - port: 5432
      targetPort: 5432
