# Standard Kubernetes deployment for BookStack.
# App image: lscr.io/linuxserver/bookstack (LinuxServer.io's maintained image).
# DB image: mariadb:11 (official) - BookStack is a Laravel/PHP app and needs
# MySQL/MariaDB, not Postgres.
# Pinned to a specific version (not :latest) - bug 29 in
# docs/01-setup-and-runbook.md was directly caused by an unpinned :latest
# pull silently changing image behavior. Check
# https://docs.linuxserver.io/images/docker-bookstack/ for newer releases,
# or let Renovate (renovate.json) open a PR automatically.
#
# The `bookstack-secrets` Secret is deliberately NOT defined here - same
# selfHeal reasoning as tandoor.yaml. Create it once, out of band, before
# first sync:
#   kubectl create namespace bookstack
#   kubectl create secret generic bookstack-secrets -n bookstack \
#     --from-literal=MYSQL_ROOT_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=MYSQL_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=APP_KEY="base64:$(openssl rand -base64 32)"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookstack-db-data
  namespace: bookstack
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookstack-uploads
  namespace: bookstack
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bookstack-db
  namespace: bookstack
spec:
  serviceName: bookstack-db
  replicas: 1
  selector:
    matchLabels:
      app: bookstack-db
  template:
    metadata:
      labels:
        app: bookstack-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookstack-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: bookstack
            - name: MYSQL_USER
              value: bookstack
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookstack-secrets
                  key: MYSQL_PASSWORD
          # Observed live usage ~184Mi (2026-08-29) - headroom for MariaDB's
          # buffer pool to grow as the wiki's content grows.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bookstack-db-data

---
apiVersion: v1
kind: Service
metadata:
  name: bookstack-db
  namespace: bookstack
spec:
  selector:
    app: bookstack-db
  ports:
    - port: 3306
      targetPort: 3306

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstack
  namespace: bookstack
spec:
  replicas: 1
  # See the same comment in manifests/tandoor/tandoor.yaml - bookstack-uploads
  # is ReadWriteOnce, single replica, RollingUpdate would deadlock on rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bookstack
  template:
    metadata:
      labels:
        app: bookstack
    spec:
      containers:
        - name: bookstack
          image: lscr.io/linuxserver/bookstack:26.05.3
          ports:
            - containerPort: 80
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Berlin"
            - name: APP_URL
              value: "https://wiki.matt-host.de"
            # Newer linuxserver/bookstack builds stopped auto-generating an
            # APP_KEY (Laravel's app-level encryption key) on first run -
            # without it the container halts init before ever listening on
            # port 80, which looks like a normal Running pod but fails every
            # connection (confirmed live: 502 at the edge, connection
            # refused straight to the pod's ClusterIP, `kubectl logs` showing
            # "The application key is missing, halting init!"). Same
            # out-of-band-secret pattern as DB_PASS below - see the top of
            # this file for how bookstack-secrets is seeded.
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: bookstack-secrets
                  key: APP_KEY
            # KNOWN LANDMINE (confirmed live 2026-08-29): this build of the
            # image no longer substitutes DB_HOST/DB_USER/DB_PASS/DB_DATABASE
            # into /config/www/.env at all - Laravel/BookStack only ever
            # reads its OWN persisted .env file (on the `uploads` PVC below),
            # and a from-scratch .env is just the raw stock template
            # (DB_HOST=localhost, DB_USERNAME=database_username, etc.),
            # regardless of these env vars being correctly present in the
            # container. These four env vars are kept here for documentation/
            # continuity, but they are NOT what BookStack actually connects
            # with - if /config/www/.env is ever lost or regenerated fresh
            # (a PVC reset, or this same image update scenario recurring),
            # someone will need to manually populate it again with real
            # values using Laravel-native key names (DB_USERNAME/DB_PASSWORD,
            # not DB_USER/DB_PASS) - see bug 29 in docs/01-setup-and-runbook.md.
            # A more permanent fix would mount .env itself from a Secret
            # (subPath overlay onto /config/www/.env) instead of relying on
            # this substitution path at all - not done here since it's an
            # untested change to make live during an active incident.
            - name: DB_HOST
              value: bookstack-db
            - name: DB_USER
              value: bookstack
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: bookstack-secrets
                  key: MYSQL_PASSWORD
            - name: DB_DATABASE
              value: bookstack
          # Observed live usage ~65Mi (2026-08-29).
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: uploads
              mountPath: /config
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: bookstack-uploads

---
apiVersion: v1
kind: Service
metadata:
  name: bookstack
  namespace: bookstack
spec:
  selector:
    app: bookstack
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookstack
  namespace: bookstack
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - wiki.matt-host.de
      secretName: bookstack-tls
  rules:
    - host: wiki.matt-host.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bookstack
                port:
                  number: 80
