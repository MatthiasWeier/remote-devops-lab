# Standard Kubernetes deployment for Tandoor Recipes.
# Image: vabene1111/recipes (Tandoor's official Docker Hub image).
# Pinned to a specific version (not :latest) - see
# https://hub.docker.com/r/vabene1111/recipes/tags for newer releases, or
# let Renovate (renovate.json) open a PR automatically when one exists.
# Env var names below match Tandoor's documented Docker env config as of
# this writing - double check against current docs if the app fails to
# start after upgrading.
#
# `tandoor-secrets` is now GitOps-managed via Sealed Secrets - see
# sealed-secrets.yaml in this same directory. Same reasoning as
# longhorn-ui/ingress.yaml: a SealedSecret's ciphertext IS the real value, so
# ArgoCD's selfHeal re-applying it is correct instead of the thing that used
# to force this out-of-band in the first place.
#
# To rotate a value, reseal in a single remote SSH session on a cluster node
# (never pipe secret material through a Windows shell - bug 27):
#   kubectl create secret generic tandoor-secrets -n tandoor \
#     --from-literal=SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 32)" \
#     --dry-run=client -o yaml \
#     | kubeseal --format yaml --cert <(kubeseal --fetch-cert) \
#     > sealed-secrets.yaml
# Rotating POSTGRES_PASSWORD this way is NOT enough by itself - the running
# Postgres pod's actual user password on disk won't change just because the
# Secret did (env vars are injected once at container start, same class of
# gap as bug 21). You'd also need `ALTER USER tandoor PASSWORD ...` inside
# the postgres pod and a rollout restart of both StatefulSet and Deployment.

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tandoor-postgres-data
  namespace: tandoor
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tandoor-media
  namespace: tandoor
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tandoor-static
  namespace: tandoor
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tandoor-postgres
  namespace: tandoor
spec:
  serviceName: tandoor-postgres
  replicas: 1
  selector:
    matchLabels:
      app: tandoor-postgres
  template:
    metadata:
      labels:
        app: tandoor-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: tandoor
            - name: POSTGRES_USER
              value: tandoor
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tandoor-secrets
                  key: POSTGRES_PASSWORD
          # Observed live usage ~48Mi at rest (2026-08-29) - request covers
          # that with headroom, limit leaves room to grow with more recipes
          # without starving other pods on the same node.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tandoor-postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: tandoor-postgres
  namespace: tandoor
spec:
  selector:
    app: tandoor-postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tandoor
  namespace: tandoor
spec:
  replicas: 1
  # Default RollingUpdate tries to start the new pod before killing the old
  # one - impossible here since tandoor-media/tandoor-static are
  # ReadWriteOnce and a single-replica Deployment has no second node to
  # share them with, so every rollout deadlocks on a Multi-Attach error
  # until the old pod is manually deleted. Recreate avoids that entirely.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tandoor
  template:
    metadata:
      labels:
        app: tandoor
    spec:
      containers:
        - name: tandoor
          image: vabene1111/recipes:2.6.13
          ports:
            - containerPort: 8080
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tandoor-secrets
                  key: SECRET_KEY
            - name: DB_ENGINE
              value: django.db.backends.postgresql
            - name: POSTGRES_HOST
              value: tandoor-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: tandoor
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tandoor-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: tandoor
            - name: ALLOWED_HOSTS
              value: "tandoor.matt-host.de"
            - name: TANDOOR_PORT
              value: "8080"
          # Observed live usage ~818Mi (2026-08-29, likely image/thumbnail
          # processing) - request set below that peak on purpose (it's not
          # sustained), limit gives real headroom above it rather than
          # OOMKilling on the next big recipe import.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          volumeMounts:
            - name: media
              mountPath: /opt/recipes/mediafiles
            - name: static
              mountPath: /opt/recipes/staticfiles
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: tandoor-media
        - name: static
          persistentVolumeClaim:
            claimName: tandoor-static

---
apiVersion: v1
kind: Service
metadata:
  name: tandoor
  namespace: tandoor
spec:
  selector:
    app: tandoor
  ports:
    - port: 80
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tandoor
  namespace: tandoor
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tandoor.matt-host.de
      secretName: tandoor-tls
  rules:
    - host: tandoor.matt-host.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tandoor
                port:
                  number: 80
