# cert-manager's own metrics Service (port 9402) already exists from the
# upstream chart install - never wired into Prometheus. Gives certificate
# expiry countdowns (certmanager_certificate_expiration_timestamp_seconds)
# among other things.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
      app.kubernetes.io/component: controller
  endpoints:
    - port: tcp-prometheus-servicemonitor
      interval: 60s
