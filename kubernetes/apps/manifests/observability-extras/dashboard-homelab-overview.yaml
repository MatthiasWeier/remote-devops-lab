# Grafana auto-discovers any ConfigMap labeled grafana_dashboard: "1" in ANY
# namespace (confirmed live via the grafana-sc-dashboard sidecar container's
# env: LABEL=grafana_dashboard, LABEL_VALUE=1, NAMESPACE=ALL) - this makes
# the dashboard genuinely GitOps-managed instead of a one-off API call.
#
# To edit: change the JSON below, commit, push. ArgoCD re-applies the
# ConfigMap and the sidecar picks up the change automatically - no manual
# Grafana UI edits or API calls needed going forward.
#
# COLOR SEMANTICS - learned the hard way, worth preserving as a comment:
# any stat/gauge/bargauge panel that omits BOTH fieldConfig.defaults.color
# and .thresholds still gets colored - Grafana falls back to a *built-in*
# default (green at 0, red at 80), not "no color". That silently painted
# the 24h request-count stat and both Top-10-pods bar gauges red, since
# raw request counts and byte values routinely exceed 80. Two rules now
# applied everywhere in this file to avoid that recurring:
#   1. Any panel whose value is a genuine magnitude with no "bad direction"
#      (request counts, top-N resource consumers) gets an EXPLICIT
#      color.mode: "fixed" - never left to fall through to the default.
#   2. Any panel encoding a status category (ArgoCD Healthy/Unhealthy/
#      OutOfSync) is colored via byName field overrides with a FIXED color
#      per label, not via numeric thresholds - "Healthy" must always render
#      green regardless of the count, which a threshold-on-magnitude can't
#      express correctly (a threshold like ">=1 is green" breaks the moment
#      the healthy count is legitimately 0, e.g. mid-outage).
# Real utilization gauges (CPU/RAM/disk %) keep threshold-based coloring
# (green/orange/red at 75%/90%) since there magnitude genuinely IS the
# signal - but color.mode: "thresholds" is now set explicitly rather than
# assumed, since gauge/bargauge apparently don't reliably default to it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-homelab-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  homelab-overview.json: |
    {
      "id": null,
      "uid": "homelab-overview",
      "title": "Homelab Overview",
      "tags": ["homelab", "overview"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 0,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        { "type": "row", "title": "🎯 Cluster Health", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "id": 100 },

        { "type": "stat", "title": "Nodes Ready", "id": 1,
          "gridPos": { "h": 6, "w": 4, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(kube_node_status_condition{condition=\"Ready\", status=\"true\"})", "refId": "A" }],
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 3 }] } }, "overrides": [] },
          "options": { "graphMode": "none", "colorMode": "background" } },

        { "type": "piechart", "title": "Pod Health", "id": 2,
          "gridPos": { "h": 6, "w": 6, "x": 4, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "legendFormat": "Running", "refId": "A" },
            { "expr": "sum(kube_pod_status_phase{phase!=\"Running\", phase!=\"Succeeded\"}) OR on() vector(0)", "legendFormat": "Not Running", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "fixed" } }, "overrides": [
            { "matcher": { "id": "byName", "options": "Running" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }] },
            { "matcher": { "id": "byName", "options": "Not Running" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }] }
          ] },
          "options": { "pieType": "donut", "legend": { "displayMode": "list", "placement": "right", "showLegend": true, "values": ["value"] }, "tooltip": { "mode": "single" } } },

        { "type": "gauge", "title": "Cluster CPU Usage", "id": 3,
          "gridPos": { "h": 6, "w": 7, "x": 10, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 75 }, { "color": "red", "value": 90 }] } }, "overrides": [] },
          "options": { "showThresholdLabels": false, "showThresholdMarkers": true, "orientation": "auto" } },

        { "type": "gauge", "title": "Cluster Memory Usage", "id": 4,
          "gridPos": { "h": 6, "w": 7, "x": 17, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "100 * (1 - (sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)))", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 75 }, { "color": "red", "value": 90 }] } }, "overrides": [] },
          "options": { "showThresholdLabels": false, "showThresholdMarkers": true, "orientation": "auto" } },

        { "type": "row", "title": "🚀 GitOps (ArgoCD)", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 7 }, "id": 101 },

        { "type": "bargauge", "title": "Application Status", "id": 5,
          "gridPos": { "h": 5, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(argocd_app_info{health_status=\"Healthy\"})", "legendFormat": "Healthy", "refId": "A" },
            { "expr": "count(argocd_app_info{health_status!=\"Healthy\"}) OR on() vector(0)", "legendFormat": "Unhealthy", "refId": "B" },
            { "expr": "count(argocd_app_info{sync_status!=\"Synced\"}) OR on() vector(0)", "legendFormat": "OutOfSync", "refId": "C" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "color": { "mode": "fixed", "fixedColor": "blue" } }, "overrides": [
            { "matcher": { "id": "byName", "options": "Healthy" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }] },
            { "matcher": { "id": "byName", "options": "Unhealthy" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }] },
            { "matcher": { "id": "byName", "options": "OutOfSync" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }] }
          ] },
          "options": { "orientation": "horizontal", "displayMode": "gradient", "showUnfilled": true, "reduceOptions": { "calcs": ["lastNotNull"], "values": false } } },

        { "type": "row", "title": "🔔 Alerting Pipeline", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 13 }, "id": 104 },

        { "type": "stat", "title": "ntfy-alertmanager Bridge", "id": 16,
          "description": "Deliberately reads kube-state-metrics, not the bridge's own /metrics - this panel has to work even when the bridge is the thing that's down, so it can't depend on the bridge for its own data.",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "kube_deployment_status_replicas_available{namespace=\"monitoring\", deployment=\"ntfy-alertmanager\"}", "refId": "A" }],
          "fieldConfig": { "defaults": { "mappings": [
            { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" } } },
            { "type": "range", "options": { "from": 1, "to": 999, "result": { "text": "UP", "color": "green" } } }
          ], "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] } }, "overrides": [] },
          "options": { "graphMode": "none", "colorMode": "background", "textMode": "value" } },

        { "type": "stat", "title": "Alertmanager", "id": 17,
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(kube_statefulset_status_replicas_ready{namespace=\"monitoring\", statefulset=~\"alertmanager-.*\"})", "refId": "A" }],
          "fieldConfig": { "defaults": { "mappings": [
            { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" } } },
            { "type": "range", "options": { "from": 1, "to": 999, "result": { "text": "UP", "color": "green" } } }
          ], "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] } }, "overrides": [] },
          "options": { "graphMode": "none", "colorMode": "background", "textMode": "value" } },

        { "type": "row", "title": "🌐 Traffic (Traefik)", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 }, "id": 102 },

        { "type": "stat", "title": "Requests (last 24h)", "id": 6,
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 19 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(increase(traefik_service_requests_total{exported_service!=\"\"}[24h]))", "refId": "A" }],
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "blue" } }, "overrides": [] },
          "options": { "graphMode": "area", "colorMode": "value" } },

        { "type": "timeseries", "title": "Request rate by app (req/s)", "id": 7,
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 19 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(rate(traefik_service_requests_total{exported_service!=\"\"}[5m])) by (exported_service)", "legendFormat": "{{exported_service}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] } },

        { "type": "timeseries", "title": "Requests by HTTP status code (req/s)", "id": 8,
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 27 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(rate(traefik_service_requests_total{exported_service!=\"\"}[5m])) by (code)", "legendFormat": "HTTP {{code}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] } },

        { "type": "row", "title": "💻 Node & Container Resources", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 33 }, "id": 103 },

        { "type": "timeseries", "title": "Node CPU usage %", "id": 9,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 34 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{instance}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0,
            "custom": { "thresholdsStyle": { "mode": "dashed" } },
            "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 75 }, { "color": "red", "value": 90 }] } }, "overrides": [] } },

        { "type": "timeseries", "title": "Node memory usage %", "id": 10,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 34 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))", "legendFormat": "{{instance}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0,
            "custom": { "thresholdsStyle": { "mode": "dashed" } },
            "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 75 }, { "color": "red", "value": 90 }] } }, "overrides": [] } },

        { "type": "bargauge", "title": "Node disk usage % (root filesystem)", "id": 11,
          "gridPos": { "h": 5, "w": 24, "x": 0, "y": 42 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "100 * (1 - (node_filesystem_avail_bytes{mountpoint=\"/\", fstype!=\"rootfs\"} / node_filesystem_size_bytes{mountpoint=\"/\", fstype!=\"rootfs\"}))", "legendFormat": "{{instance}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 75 }, { "color": "red", "value": 90 }] } }, "overrides": [] },
          "options": { "orientation": "horizontal", "displayMode": "gradient", "showUnfilled": true, "reduceOptions": { "calcs": ["lastNotNull"], "values": false } } },

        { "type": "timeseries", "title": "Container CPU usage by namespace (cores)", "id": 12,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 47 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(rate(container_cpu_usage_seconds_total{namespace!=\"\", container!=\"\", container!=\"POD\"}[5m])) by (namespace)", "legendFormat": "{{namespace}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] } },

        { "type": "timeseries", "title": "Container memory usage by namespace", "id": 13,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 47 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(container_memory_working_set_bytes{namespace!=\"\", container!=\"\", container!=\"POD\"}) by (namespace)", "legendFormat": "{{namespace}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] } },

        { "type": "bargauge", "title": "Top 10 pods by CPU", "id": 14,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 55 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "topk(10, sum(rate(container_cpu_usage_seconds_total{container!=\"\", container!=\"POD\"}[5m])) by (namespace, pod))", "legendFormat": "{{namespace}}/{{pod}}", "instant": true, "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "fixed", "fixedColor": "blue" } }, "overrides": [] },
          "options": { "orientation": "horizontal", "displayMode": "gradient", "showUnfilled": true, "reduceOptions": { "calcs": ["lastNotNull"], "values": false } } },

        { "type": "bargauge", "title": "Top 10 pods by memory", "id": 15,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 55 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "topk(10, sum(container_memory_working_set_bytes{container!=\"\", container!=\"POD\"}) by (namespace, pod))", "legendFormat": "{{namespace}}/{{pod}}", "instant": true, "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "fixed", "fixedColor": "blue" } }, "overrides": [] },
          "options": { "orientation": "horizontal", "displayMode": "gradient", "showUnfilled": true, "reduceOptions": { "calcs": ["lastNotNull"], "values": false } } }
      ]
    }
