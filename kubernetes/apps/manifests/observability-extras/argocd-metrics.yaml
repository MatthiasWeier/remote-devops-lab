# ArgoCD's own metrics Service (argocd-metrics, port 8082) already exists as
# part of the upstream install - it's just never been wired into Prometheus.
# Gives per-Application sync/health status (argocd_app_info) - the most
# direct "is everything actually live" signal for a GitOps-managed cluster,
# since it reflects what ArgoCD itself believes about every app's state.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-metrics
  namespace: argocd
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
  endpoints:
    - port: metrics
      interval: 30s
