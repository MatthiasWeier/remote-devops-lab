# Configures Longhorn's off-cluster backup target.
#
# IMPORTANT: Longhorn in this cluster was installed directly via `helm
# install` (out-of-band, not an ArgoCD Application - there's no
# kubernetes/apps/longhorn.yaml in this repo). That means a
# `defaultSettings.backupTarget` Helm value only takes effect on a FRESH
# install; it will NOT retroactively change a live setting. The two Setting
# custom resources below are the intended live-update mechanism, but confirmed
# live on this cluster: Longhorn's `mutator.longhorn.io` admission webhook
# rejects a plain `kubectl apply`/create for a Setting object that doesn't
# already exist server-side ("setting backup-target does not exist") - `backup-target`
# and `backup-target-credential-secret` are apparently created lazily by
# Longhorn's own controller on first configuration, not pre-seeded for every
# possible setting name. Until you configure a backup target ONCE through the
# Longhorn UI (now reachable via ingress.yaml in this same directory) or its
# API - which makes the Setting object exist - ArgoCD will keep retrying this
# Application and failing on that same admission error. Once it exists,
# GitOps patches here should take over cleanly. This is a real, unresolved
# limitation of this design, not a placeholder value issue - flagging it
# rather than pretending it already works.
#
# --- STATUS AS OF 2026-08-29: prepared ahead of time, not yet live. ---
# No NAS exists on the network yet (arriving within a few weeks). The value
# below is a deliberate PLACEHOLDER hostname, "NAS-Backup" - once the real
# NAS is racked, replace it with its actual reachable hostname or IP and
# the real share path (and add a DNS entry or /etc/hosts-equivalent for
# "NAS-Backup" if you'd rather keep that name than switch to a raw IP).
#
# This file being present and even resolving DNS-wise is NOT enough on its
# own to go live - see the prerequisite explained above (bug 26): Longhorn's
# admission webhook rejects these Setting objects entirely until a backup
# target has been configured ONCE through the Longhorn UI/API, which is
# what makes the Setting exist server-side for GitOps to take over
# afterward. Expect this Application to keep failing that same admission
# error (`setting backup-target does not exist`) until that one-time manual
# step happens - that's expected, not a sign this file is wrong.
#
# For documentation/parity, if you ever do a from-scratch reinstall, the
# equivalent Helm value is:
#   defaultSettings:
#     backupTarget: "nfs://NAS-Backup:/volume1/longhorn-backups"
#
# If the NAS ends up being S3-compatible instead of NFS (e.g. MinIO running
# on it), switch the value below to the s3:// form instead and uncomment
# the credential Setting + Secret creation command underneath - format is
# s3://<bucket>@<region>/<optional-path>, and AWS_ENDPOINTS in the Secret
# points at the NAS's S3-compatible endpoint.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: backup-target
  namespace: longhorn-system
value: "nfs://NAS-Backup:/volume1/longhorn-backups"

# --- Only needed for the S3 alternative above - leave commented out for NFS,
#     which has no credential secret to reference. ---
# ---
# apiVersion: longhorn.io/v1beta2
# kind: Setting
# metadata:
#   name: backup-target-credential-secret
#   namespace: longhorn-system
# value: "longhorn-backup-secret"
#
# The Secret itself is NOT defined here (real access keys, same
# out-of-band-secret pattern as the rest of this repo, or seal it - see
# sealed-secrets.yaml in this repo for the pattern). Create it once the S3
# endpoint actually exists:
#   kubectl create secret generic longhorn-backup-secret -n longhorn-system \
#     --from-literal=AWS_ACCESS_KEY_ID="<your-access-key>" \
#     --from-literal=AWS_SECRET_ACCESS_KEY="<your-secret-key>" \
#     --from-literal=AWS_ENDPOINTS="https://your-s3-endpoint"
