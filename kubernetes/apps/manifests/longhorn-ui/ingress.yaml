# Exposes the Longhorn UI at longhorn.matt-host.de. The UI ships with ZERO
# built-in authentication - it can detach volumes, delete replicas, and wipe
# backups from a browser with no login prompt. The Traefik BasicAuth
# Middleware below is not optional hardening, it's the only thing standing
# between the internet and destructive volume operations. Do not remove it
# to "simplify" this.
#
# The htpasswd Secret is now GitOps-managed via Sealed Secrets (see
# sealed-basic-auth.yaml in this same directory) instead of being created
# out-of-band. This used to be a hard blocker: with syncPolicy.automated.
# selfHeal, a Secret defined in git as a plaintext placeholder would get
# continuously re-applied over any real credential. A SealedSecret sidesteps
# that entirely - what's committed to git IS the real credential, just
# asymmetrically encrypted, so selfHeal reverting to git is now correct
# behavior instead of the thing that used to make this impossible.
#
# To rotate the credential:
#   htpasswd -nbB <username> '<new-password>' > /tmp/longhorn-htpasswd
#   kubectl create secret generic longhorn-basic-auth -n longhorn-system \
#     --from-file=users=/tmp/longhorn-htpasswd --dry-run=client -o yaml \
#     | kubeseal --format yaml --cert <(kubeseal --fetch-cert) \
#     > sealed-basic-auth.yaml
#   rm /tmp/longhorn-htpasswd
# then commit sealed-basic-auth.yaml. Do this in one remote SSH session on a
# cluster node, never piping the plaintext htpasswd file through a Windows
# shell first (see docs/01-setup-and-runbook.md bug 27 - a BOM silently
# corrupted a secret piped this way before).
#
# If the Middleware CRD's apiVersion below doesn't exist in your cluster,
# check which Traefik CRD group K3s shipped:
#   kubectl get crd | grep -i traefik
# Older K3s versions (Traefik v2) use traefik.containo.us/v1alpha1 instead.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: longhorn-basic-auth
  namespace: longhorn-system
spec:
  basicAuth:
    secret: longhorn-basic-auth

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ui
  namespace: longhorn-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Namespace-prefixed per Traefik's cross-namespace reference format:
    # <namespace>-<middleware-name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: longhorn-system-longhorn-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - longhorn.matt-host.de
      secretName: longhorn-ui-tls
  rules:
    - host: longhorn.matt-host.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
