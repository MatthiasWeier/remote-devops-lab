# Bridges Alertmanager's webhook_configs (fixed JSON schema, no templating)
# to ntfy.sh's publish API (title/priority/tags, plain-text body). See
# manifests/ntfy-alertmanager/sealed-config.yaml for why the bridge's config
# is a SealedSecret rather than a ConfigMap.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntfy-alertmanager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/MatthiasWeier/remote-devops-lab.git
    targetRevision: main
    path: kubernetes/apps/manifests/ntfy-alertmanager

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
