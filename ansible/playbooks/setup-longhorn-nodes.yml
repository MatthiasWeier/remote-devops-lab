---
# Prepares K3s worker nodes for Longhorn distributed block storage:
# installs iSCSI/NFS prerequisites and formats + mounts the secondary
# Terraform-provisioned disk (scsi1) at /var/lib/longhorn.
#
# Only targets `workers` because control-plane nodes are not given a
# secondary_disk_size in terraform.tfvars - see terraform/proxmox/README.md.
# If you later schedule workloads on the control-plane too, give it a
# secondary_disk_size in Terraform first, then add it to this play's hosts.

- name: Prepare nodes for Longhorn storage
  hosts: workers
  become: yes
  gather_facts: yes
  vars:
    longhorn_mount_path: /var/lib/longhorn
    longhorn_filesystem: ext4
  tags:
    - longhorn
    - longhorn_nodes

  pre_tasks:
    - name: Display target hosts
      debug:
        msg: "Preparing {{ inventory_hostname }} for Longhorn storage"
      tags:
        - always

    # Device naming (sda/sdb/...) for the scsi0 (root) vs scsi1 (Longhorn)
    # disks is NOT guaranteed by kernel/boot order - confirmed the hard way:
    # on one node the blank Longhorn disk came up as /dev/sda while the
    # cloned, partitioned, mounted root disk came up as /dev/sdb. Hardcoding
    # a device name risks running mkfs on the running root filesystem.
    #
    # Instead, identify the Longhorn disk structurally: it is the only sdX
    # block device with an EMPTY partition table. The cloned root disk
    # always has partitions (from the Cloud-Init template); a fresh
    # Terraform-attached data disk never does.
    - name: Find candidate unpartitioned secondary disks
      set_fact:
        longhorn_disk_candidates: "{{ ansible_devices | dict2items | selectattr('key', 'match', '^sd[a-z]+$') | selectattr('value.partitions', 'equalto', {}) | map(attribute='key') | list }}"
      tags:
        - always

    - name: Fail if the Longhorn disk can't be uniquely identified
      assert:
        that:
          - longhorn_disk_candidates | length == 1
        fail_msg: >
          Expected exactly one unpartitioned secondary disk on {{ inventory_hostname }},
          found: {{ longhorn_disk_candidates }}. Refusing to guess which one is safe to
          format - confirm `secondary_disk_size` is set for this node in terraform.tfvars
          and that `terraform apply` has been run, then investigate manually.
      tags:
        - always

    - name: Set the Longhorn data disk device
      set_fact:
        longhorn_data_disk: "/dev/{{ longhorn_disk_candidates[0] }}"
      tags:
        - always

    - name: Display identified Longhorn disk
      debug:
        msg: "{{ inventory_hostname }}: using {{ longhorn_data_disk }} for Longhorn storage"
      tags:
        - always

  tasks:
    - name: Install Longhorn OS prerequisites
      apt:
        name:
          - open-iscsi
          - nfs-common
          - util-linux
        state: present
        update_cache: yes
      tags:
        - longhorn
        - packages

    - name: Ensure iscsid service is enabled and started
      systemd:
        name: iscsid
        state: started
        enabled: yes
      tags:
        - longhorn
        - services

    - name: Check for an existing filesystem on the secondary disk
      command: "blkid -o value -s TYPE {{ longhorn_data_disk }}"
      register: longhorn_disk_fstype
      changed_when: false
      failed_when: false
      tags:
        - longhorn
        - storage

    - name: Create {{ longhorn_filesystem }} filesystem on secondary disk
      filesystem:
        fstype: "{{ longhorn_filesystem }}"
        dev: "{{ longhorn_data_disk }}"
      when: longhorn_disk_fstype.stdout | length == 0
      tags:
        - longhorn
        - storage

    - name: Create Longhorn mount point
      file:
        path: "{{ longhorn_mount_path }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - longhorn
        - storage

    - name: Mount secondary disk persistently via /etc/fstab
      mount:
        path: "{{ longhorn_mount_path }}"
        src: "{{ longhorn_data_disk }}"
        fstype: "{{ longhorn_filesystem }}"
        opts: defaults,nofail
        state: mounted
      tags:
        - longhorn
        - storage

  post_tasks:
    - name: Verify Longhorn mount point is active
      command: "findmnt {{ longhorn_mount_path }}"
      register: longhorn_mount_check
      changed_when: false
      tags:
        - verify

    - name: Display Longhorn mount status
      debug:
        msg: "{{ longhorn_mount_check.stdout_lines }}"
      tags:
        - verify
