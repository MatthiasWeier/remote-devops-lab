---
# Tasks to install Docker Engine and Docker Compose on Debian/Ubuntu systems

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - docker
    - packages

- name: Install required packages for Docker repository
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - rsync
    state: present
  tags:
    - docker
    - packages

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/debian/gpg
    state: present
  tags:
    - docker
    - packages

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present
    filename: docker-ce
  tags:
    - docker
    - packages

- name: Update apt cache after adding Docker repository
  apt:
    update_cache: yes
  tags:
    - docker
    - packages

- name: Install Docker Engine, CLI, and containerd
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  tags:
    - docker
    - packages

- name: Ensure Docker service is started and enabled
  systemd:
    name: docker
    state: started
    enabled: yes
    daemon_reload: yes
  tags:
    - docker
    - services

- name: Ensure containerd service is started and enabled
  systemd:
    name: containerd
    state: started
    enabled: yes
    daemon_reload: yes
  tags:
    - docker
    - services

- name: Add ansible user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  tags:
    - docker
    - users

- name: Verify Docker installation
  command: docker --version
  register: docker_version_output
  changed_when: false
  tags:
    - docker
    - verify

- name: Display Docker version
  debug:
    msg: "{{ docker_version_output.stdout }}"
  tags:
    - docker
    - verify
